# .github/workflows/build-and-release.yml
# GitHub Actions workflow for LitePM (.NET Framework 4.8 VB.NET)
#
# Release package contract (used by LiteTask, Tools > Process manager):
#   - asset name LitePM.zip (fixed, so that
#     https://github.com/svtica/LitePM/releases/latest/download/LitePM.zip
#     always points to the latest release) on a v<semver> tag release;
#     LiteTask matches ^LitePM.*\.zip$ (LiteTask 1.2.2.5 and later);
#   - LitePM.exe and all its dependencies (DLLs, .config) in the same folder;
#   - LitePM.exe signed with Authenticode when the SIGNING_CERTIFICATE secret
#     exists (LiteTask refuses a signature that does not match the file and
#     installs an unsigned exe with a warning).
#
# Signing secrets (repository settings > Secrets and variables > Actions):
#   SIGNING_CERTIFICATE   the .pfx file, base64-encoded
#   CERTIFICATE_PASSWORD  its password
# Without them the build still runs and produces an unsigned package.

name: Build and Release

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  # Called by release.yml (Actions > Release > Run workflow) with the tag it
  # just pushed: a tag pushed from a workflow does not trigger this one.
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v1.0.2)'
        type: string
        required: true

# A tag push and the matching release event build the same ref: run them one
# after the other so the release asset is not uploaded twice at once.
concurrency:
  group: build-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  # The ref being released/built: the called tag, else the triggering ref
  RELEASE_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE }}
  CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref }}

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore external dependencies from res/
      run: |
        # Pre-copy SecureChannel to its HintPath location so LitePM can resolve
        # it during build (SecureChannel project builds after LitePM in MSBuild order)
        New-Item -ItemType Directory -Force -Path "SecureChannel\bin\Release"
        Copy-Item "res\SecureChannel.dll" -Destination "SecureChannel\bin\Release\"

        Write-Host "Restored dependencies from res/"
      shell: powershell

    - name: Build solution
      run: |
        msbuild LitePM.sln --% -restore /p:Configuration=Release /p:Platform="Any CPU"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      shell: powershell

    - name: Copy fallback DLLs from res/ if missing
      run: |
        $buildPath = "LitePM\bin\Release"
        $fallbackDlls = @(
          "Aga.Controls.dll",
          "SecureChannel.dll",
          "SecurePasswordTextBox.dll",
          "TaskDialog.dll"
        )
        foreach ($dll in $fallbackDlls) {
          if (!(Test-Path "$buildPath\$dll")) {
            Write-Host "Missing $dll in build output, copying from res/"
            Copy-Item "res\$dll" -Destination "$buildPath\"
          }
        }
      shell: powershell

    - name: Copy dependencies and assets
      run: |
        $buildPath = "LitePM\bin\Release"
        $publishPath = "publish"

        New-Item -ItemType Directory -Force -Path $publishPath

        Copy-Item "$buildPath\*.exe" -Destination $publishPath -ErrorAction SilentlyContinue
        Copy-Item "$buildPath\*.dll" -Destination $publishPath -ErrorAction SilentlyContinue
        Copy-Item "$buildPath\*.config" -Destination $publishPath -ErrorAction SilentlyContinue

        Copy-Item "README.md" -Destination $publishPath -ErrorAction SilentlyContinue
        Copy-Item "LICENSE" -Destination $publishPath -ErrorAction SilentlyContinue
        Copy-Item "CHANGELOG.md" -Destination $publishPath -ErrorAction SilentlyContinue

        if (Test-Path "Resources") {
          Copy-Item "Resources" -Destination $publishPath -Recurse -ErrorAction SilentlyContinue
        }
      shell: powershell

    - name: Decode certificate
      if: ${{ env.CERTIFICATE_BASE64 != '' }}
      run: |
        $certBytes = [System.Convert]::FromBase64String($env:CERTIFICATE_BASE64)
        $certPath = Join-Path -Path $env:RUNNER_TEMP -ChildPath "signing-cert.pfx"
        [IO.File]::WriteAllBytes($certPath, $certBytes)
        echo "CERTIFICATE_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Append
      shell: pwsh

    - name: Sign executables and DLLs
      if: ${{ env.CERTIFICATE_BASE64 != '' }}
      run: ./tools/ci/Sign-Binaries.ps1 -Dir publish -CertPath "$env:CERTIFICATE_PATH"
      shell: pwsh

    # Without the secret, still exercise the signing script on a copy of the
    # binaries with a throw-away self-signed certificate (trusted on this
    # ephemeral runner only). The package itself stays unsigned.
    - name: Signing self-test (no secret)
      if: ${{ env.CERTIFICATE_BASE64 == '' }}
      run: |
        $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=LitePM CI self-test" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(1)
        $pfxPassword = [guid]::NewGuid().ToString()
        $env:SELFTEST_PASSWORD = $pfxPassword
        $pfx = Join-Path $env:RUNNER_TEMP "selftest.pfx"
        Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $pfxPassword -AsPlainText -Force) | Out-Null
        $cer = Join-Path $env:RUNNER_TEMP "selftest.cer"
        Export-Certificate -Cert $cert -FilePath $cer | Out-Null
        Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
        $copy = Join-Path $env:RUNNER_TEMP "sign-selftest"
        New-Item -ItemType Directory -Force -Path $copy | Out-Null
        Copy-Item "publish\*.exe", "publish\*.dll" -Destination $copy
        ./tools/ci/Sign-Binaries.ps1 -Dir $copy -CertPath $pfx -PasswordEnvVar SELFTEST_PASSWORD
        Remove-Item $pfx, $cer -Force
      shell: pwsh

    - name: Remove certificate
      if: always()
      run: |
        if ($env:CERTIFICATE_PATH -and (Test-Path $env:CERTIFICATE_PATH)) {
          Remove-Item $env:CERTIFICATE_PATH -Force
        }
      shell: pwsh

    - name: Warn when the release is unsigned
      if: ${{ env.CERTIFICATE_BASE64 == '' && startsWith(env.RELEASE_REF, 'refs/tags/') }}
      run: echo "::warning::SIGNING_CERTIFICATE secret is not set - LitePM.exe in this release is NOT signed (LiteTask will install it with a warning)."
      shell: bash

    - name: Create release package
      run: |
        # Version of branch builds: AssemblyVersion (Major.Minor.Build). Not stored
        # in this file: a workflow cannot push changes to workflow files.
        $asm = Get-Content "LitePM\My Project\AssemblyInfo.vb" -Raw
        $m = [regex]::Match($asm, '(?m)^<Assembly:\s*AssemblyVersion\("(\d+\.\d+\.\d+)\.\d+"\)>')
        $version = if ($m.Success) { $m.Groups[1].Value } else { "0.0.0" }
        if ($env:RELEASE_REF -like "refs/tags/*") {
          $version = $env:RELEASE_REF -replace "refs/tags/v", ""
        } elseif ($env:RELEASE_REF -like "refs/heads/*") {
          $branch = ($env:RELEASE_REF -replace "refs/heads/", "") -replace "[^A-Za-z0-9._-]", "-"
          $sha = $env:GITHUB_SHA.Substring(0,7)
          $version = "$version-$branch-$sha"
        }

        Compress-Archive -Path "publish\*" -DestinationPath "LitePM.zip"
        echo "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
        echo "PACKAGE_NAME=LitePM.zip" >> $env:GITHUB_ENV
      shell: powershell

    - name: Check package layout (LiteTask contract)
      run: |
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $env:PACKAGE_NAME))
        try {
          $names = $zip.Entries | ForEach-Object { $_.FullName }
        } finally { $zip.Dispose() }
        if ($env:PACKAGE_NAME -notmatch '^LitePM.*\.zip$') { Write-Error "Asset name $env:PACKAGE_NAME breaks the LiteTask pattern"; exit 1 }
        $required = 'LitePM.exe', 'LitePM.exe.config', 'Aga.Controls.dll', 'TaskDialog.dll', 'SecurePasswordTextBox.dll', 'SecureChannel.dll'
        $missing = $required | Where-Object { $names -notcontains $_ }
        if ($missing) { Write-Error "Missing next to LitePM.exe in the zip: $($missing -join ', ')"; exit 1 }
        Write-Host "Package OK: $($names.Count) entries, LitePM.exe and its dependencies at the zip root."
      shell: powershell

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LitePM-${{ env.PACKAGE_VERSION }}-x64
        path: ${{ env.PACKAGE_NAME }}

    - name: Upload to release (if tag)
      if: startsWith(env.RELEASE_REF, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag || github.ref_name }}
        files: ./${{ env.PACKAGE_NAME }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
