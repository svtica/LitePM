# .github/workflows/build-and-release.yml
# GitHub Actions workflow for LitePM (.NET Framework 4.8 VB.NET)

name: Build and Release

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore external dependencies from res/
      run: |
        # Ribbon DLL is a pure external dependency (no project builds it)
        Copy-Item "res\System.Windows.Forms.Ribbon.dll" -Destination "LitePM\"

        # Pre-copy SecureChannel to its HintPath location so LitePM can resolve
        # it during build (SecureChannel project builds after LitePM in MSBuild order)
        New-Item -ItemType Directory -Force -Path "SecureChannel\bin\Release"
        Copy-Item "res\SecureChannel.dll" -Destination "SecureChannel\bin\Release\"

        Write-Host "Restored dependencies from res/"
      shell: powershell

    - name: Build solution
      run: |
        msbuild LitePM.sln --% /p:Configuration=Release /p:Platform="Any CPU"
      shell: powershell

    - name: Copy fallback DLLs from res/ if missing
      run: |
        $buildPath = "LitePM\bin\Release"
        $fallbackDlls = @(
          "Aga.Controls.dll",
          "SecureChannel.dll",
          "SecurePasswordTextBox.dll",
          "System.Windows.Forms.Ribbon.dll",
          "TaskDialog.dll"
        )
        foreach ($dll in $fallbackDlls) {
          if (!(Test-Path "$buildPath\$dll")) {
            Write-Host "Missing $dll in build output, copying from res/"
            Copy-Item "res\$dll" -Destination "$buildPath\"
          }
        }
      shell: powershell

    - name: Copy dependencies and assets
      run: |
        $buildPath = "LitePM\bin\Release"
        $publishPath = "publish"

        New-Item -ItemType Directory -Force -Path $publishPath

        Copy-Item "$buildPath\*.exe" -Destination $publishPath -ErrorAction SilentlyContinue
        Copy-Item "$buildPath\*.dll" -Destination $publishPath -ErrorAction SilentlyContinue
        Copy-Item "$buildPath\*.config" -Destination $publishPath -ErrorAction SilentlyContinue

        Copy-Item "README.md" -Destination $publishPath -ErrorAction SilentlyContinue
        Copy-Item "LICENSE" -Destination $publishPath -ErrorAction SilentlyContinue

        if (Test-Path "Resources") {
          Copy-Item "Resources" -Destination $publishPath -Recurse -ErrorAction SilentlyContinue
        }
      shell: powershell

    - name: Create release package
      run: |
        $version = "1.0.1"
        if ($env:GITHUB_REF -like "refs/tags/*") {
          $version = $env:GITHUB_REF -replace "refs/tags/v", ""
        } elseif ($env:GITHUB_REF -like "refs/heads/*") {
          $branch = $env:GITHUB_REF -replace "refs/heads/", ""
          $sha = $env:GITHUB_SHA.Substring(0,7)
          $version = "1.0.1-$branch-$sha"
        }

        Compress-Archive -Path "publish\*" -DestinationPath "LitePM-$version-win-x64.zip"
        echo "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
        echo "PACKAGE_NAME=LitePM-$version-win-x64.zip" >> $env:GITHUB_ENV
      shell: powershell

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LitePM-${{ env.PACKAGE_VERSION }}-x64
        path: LitePM-${{ env.PACKAGE_VERSION }}-win-x64.zip

    - name: Upload to release (if tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ./LitePM-${{ env.PACKAGE_VERSION }}-win-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

